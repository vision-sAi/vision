name: desktop

# The desktop app (desktop/) on Linux and macOS. Pull requests run the Rust tests and build the web
# side; master and manual runs build the installers too and return them as artifacts.
on:
  push:
    branches: [master]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run still going; master runs all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux }
          - { os: macos-latest, name: macos }
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - if: github.event_name == 'pull_request'
        run: npm run build
      - if: github.event_name != 'pull_request'
        run: npx tauri build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: vision-desktop-${{ matrix.name }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
