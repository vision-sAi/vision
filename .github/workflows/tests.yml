name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Once on the Python the setup script installs and once on the oldest the project supports
    # (requires-python in pyproject.toml): syntax only a newer Python accepts, such as 3.12's f-string
    # rules, fails the oldest job. The 3.12 job keeps the plain name `test` for anything that expects it.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", name: "test" }
          - { python: "3.11", name: "test (Python 3.11)" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes full versions only, no major-version tag
        with:
          python-version: ${{ matrix.python }}
      # Text chat plus the serve and weather extras. The voice extras (torch; ~6 GB with CUDA) stay out: the
      # tests fake the GPU, the microphone and the speech models, and the torch-only ones skip.
      - run: uv sync --frozen --extra serve --extra weather
      # Test-only packages: numpy and soundfile for the audio fakes, soxr for the resampler, pillow for library thumbnails, httpx2
      # for starlette's TestClient, pytest for test_int8's markers.
      - run: uv pip install numpy soundfile soxr pillow pytest httpx2
      - run: uv run --frozen --no-sync python -m unittest discover -s tests
