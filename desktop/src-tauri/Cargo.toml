[package]
name = "vision-desktop"
version = "0.2.4"
description = "Vision on the desktop: a window onto `vision serve`"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin's (a Windows clash, cargo#8519).
name = "vision_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop portal's appearance settings (dark/light, accent colour), as KDE and GNOME publish them.
zbus = { version = "5", features = ["blocking-api"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
